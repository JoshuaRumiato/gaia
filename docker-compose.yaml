version: '3.8'

networks:
  gaia-network:
    driver: bridge

volumes:
  emqx-data:
  timescaledb-data:
  grafana-data:

services:
  # =========================================
  # 1. TimescaleDB - Time-series database
  # =========================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: gaia-timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=tsdb
      - POSTGRES_DB=gaia_db
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    networks:
      - gaia-network

  # =========================================
  # 2. Fill-DB - Data population script
  # =========================================
  fill-db-service:
    build:
      context: ./fill-db
    container_name: gaia-fill-db
    restart: "no"
    depends_on:
      - timescaledb
    env_file:
      - ./fill-db/.env
    networks:
      - gaia-network

  # =========================================
  # 3. EMQX - MQTT Broker
  # =========================================
  emqx:
    image: emqx:5.5
    container_name: gaia-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"       # MQTT standard port (for Python scripts)
      - "18083:18083"     # Dashboard
    volumes:
      - emqx-data:/opt/emqx/data
    networks:
      - gaia-network

  # =========================================
  # 4. Grafana - Visualization tool
  # =========================================
  grafana:
    image: grafana/grafana:latest
    container_name: gaia-grafana
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - gaia-network

  # =========================================
  # 5. Server HTTP (Endpoint REST API)
  # =========================================
  mesapi-http-server:
    build:
      context: ./mesapi-server
    container_name: gaia-mesapi-http-server
    restart: unless-stopped
    depends_on:
      - timescaledb
    ports:
      - "8000:8000"       # REST calls (ex. http://localhost:8000/active-order?production-line=4371)
    networks:
      - gaia-network