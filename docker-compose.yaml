networks:
  gaia-infra-network:
    driver: bridge
  gaia-global-network:
    driver: bridge
    external: true

volumes:
  emqx-data:
  timescaledb-data:
  grafana-data:

services:
  # =========================================
  # 1. TimescaleDB - Time-series database
  # =========================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: gaia-timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=tsdb
      - POSTGRES_DB=gaia_db
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gaia_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gaia-infra-network

  # =========================================
  # 2. EMQX - MQTT Broker
  # =========================================
  emqx:
    image: emqx/emqx:latest
    container_name: gaia-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"       # MQTT standard port (for Python scripts)
      - "18083:18083"     # Dashboard
    volumes:
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18083/api/v5/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gaia-infra-network
      - gaia-global-network

  # =========================================
  # 3. Grafana - Visualization tool
  # =========================================
  grafana:
    image: grafana/grafana:latest
    container_name: gaia-grafana
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gaia-infra-network
